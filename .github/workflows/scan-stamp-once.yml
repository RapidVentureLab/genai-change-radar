name: Stamp completed radar scan once
on:
  push:
    paths:
      - '.github/workflows/scan-stamp-once.yml'
permissions:
  contents: write
jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update scan timestamp and validate history
        shell: python
        run: |
          import json
          from pathlib import Path
          p = Path('updates.json')
          d = json.loads(p.read_text())
          before = len(d['updates'])
          ids = [x['id'] for x in d['updates']]
          assert len(ids) == len(set(ids)), 'duplicate ids before stamp'
          required = ('id','date','layer','kind','impact','title','sources')
          assert all(all(k in x for k in required) for x in d['updates']), 'missing required field'
          assert all(x['sources'] and all(s.get('url','').startswith(('http://','https://')) for s in x['sources']) for x in d['updates']), 'missing source URL'
          d['updatedAt'] = '2026-09-21T07:47:03+02:00'
          assert len(d['updates']) == before
          p.write_text(json.dumps(d, indent=2, ensure_ascii=False) + '\n')
          json.loads(p.read_text())
      - name: Run recency regression QA
        run: node qa-recent.mjs
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/scan-stamp-once.yml
          git config user.name 'GenAI Change Radar'
          git config user.email 'actions@users.noreply.github.com'
          git add updates.json .github/workflows/scan-stamp-once.yml
          git commit -m 'Record 2026-09-21 GenAI radar scan'
          git push
