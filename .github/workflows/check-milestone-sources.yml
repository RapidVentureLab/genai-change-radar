name: Monthly milestone source check

# Reopens every milestone source on the 1st of each month.
# If a link is broken, the run fails and GitHub sends the usual failure email.
on:
  schedule:
    - cron: "23 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check milestone sources
        run: node scripts/check-sources.mjs
